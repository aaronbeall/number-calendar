<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Apply the saved theme before first paint so dark-mode visitors don't see a white flash -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>

    <!-- The app itself (src/main.tsx). The public homepage is /index.html; this page is not for search engines. -->
    <title>Numbers Go Up</title>
    <meta name="description" content="Your Numbers Go Up calendars. Data stays in this browser." />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://numbersgoup.app/app" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="application-name" content="Numbers Go Up" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#28323b" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Numbers Go Up" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Fonts: loaded without blocking first paint (text uses fallbacks until Figtree arrives) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&display=swap" /></noscript>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-G6TVJLHVMJ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-G6TVJLHVMJ');
    </script>
  </head>
  <body class="bg-white dark:bg-slate-900/80">
    <div id="root"></div>
    <noscript>
      <p style="max-width:40rem;margin:4rem auto;padding:0 1rem;font-family:system-ui,sans-serif">Numbers Go Up needs JavaScript to run. Please enable it and reload the page.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
